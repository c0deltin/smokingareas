name: Database

# Tests the Supabase migrations on a plain PostgreSQL and, on main, applies
# them to the Supabase project.
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/database.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/database.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Migrations and access rules
        run: supabase/tests/run_tests.sh

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] \
             || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase secrets missing – skipping deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.skip == 'false'

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.skip == 'false'
        with:
          version: 3.1.0

      - name: Apply migrations
        if: steps.config.outputs.skip == 'false'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
