name: Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a running build (it contains all changes):
# GitHub refuses to create a release for a commit that is no longer the
# head of main (403), which made the older build fail.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: 3.47.9
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Refresh the bundled snapshot of official municipal smoking-area lists
      # (Tokyo wards, Kyoto, Osaka). Failing sources keep their previous data;
      # the tests below validate the result before anything is released.
      - name: Test open-data importer
        run: python3 -m unittest discover -s tool/opendata -p 'test_*.py'

      - name: Use last published data as base
        run: python3 tool/opendata/use_published_base.py

      # The latest weekly OSM export goes into the app (first start offline).
      - name: Bundle latest OSM export
        run: python3 tool/opendata/use_published_osm.py

      - name: Refresh official open data
        continue-on-error: true
        run: python3 tool/opendata/update_opendata.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional: a fixed release key, so that new versions install over old
      # ones. Without these secrets the APK is signed with a throw-away debug
      # key (installable, but updates require uninstalling first).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – signing with debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          PROPS

      - name: Build APK
        env:
          # Google Maps key (restricted to this app); empty = map stays blank.
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          # Server and sign-in settings (public client values, kept out of
          # the repository); without them the app uses local community data.
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_ANON_KEY: ${{ secrets.BACKEND_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=BACKEND_URL="$BACKEND_URL" \
            --dart-define=BACKEND_ANON_KEY="$BACKEND_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/ippuku-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ippuku 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          # Appends the merged PRs / changes since the previous release.
          generate_release_notes: true
          body: |
            Automated build of `${{ github.sha }}`.

            **Installation (Android, without Play Store):**
            1. Download `ippuku-….apk` below on your phone.
            2. Open the file and allow "Install unknown apps" for your browser
               or file manager.
            3. If Play Protect shows a warning: choose "Install anyway".
            4. On first start allow location "Allow all the time" and
               notifications, so proximity alerts also work in the background.

      # The app release also refreshes the in-app data update channel, so
      # installed older versions get the same data.
      - name: Package snapshot for in-app updates
        run: python3 tool/opendata/package_snapshot.py dist/opendata

      - name: Publish data release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opendata
          name: Map data (for in-app updates)
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: dist/opendata/*
