name: iOS TestFlight

# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
# Signing uses Xcode cloud signing with an App Store Connect API key, so no
# certificate or provisioning profile has to be created by hand.
# Required repository secrets:
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_KEY_P8 (content of the .p8 file, API key role Admin)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.47.9
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_IOS }}
      # Server and sign-in settings (public client values, kept out of the
      # repository); without them the app uses local community data.
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      BACKEND_ANON_KEY: ${{ secrets.BACKEND_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::iOS secrets are not configured – skipping the TestFlight build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.skip == 'false'

      - uses: subosito/flutter-action@v2
        if: steps.config.outputs.skip == 'false'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Xcode version
        if: steps.config.outputs.skip == 'false'
        run: xcodebuild -version

      - name: Install dependencies
        if: steps.config.outputs.skip == 'false'
        run: flutter pub get

      # Writes Generated.xcconfig (version + build number) and installs pods;
      # the actual build happens in xcodebuild archive below.
      - name: Configure iOS build
        if: steps.config.outputs.skip == 'false'
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=BACKEND_URL="$BACKEND_URL" \
            --dart-define=BACKEND_ANON_KEY="$BACKEND_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"

      # Google Maps key as an uncommitted build setting (read by Info.plist);
      # written to a file so it never appears on a command line or in logs.
      - name: Install Google Maps API key and sign-in settings
        if: steps.config.outputs.skip == 'false'
        run: |
          {
            printf 'MAPS_API_KEY = %s\n' "$MAPS_API_KEY"
            # Google sign-in callback scheme: the iOS client id reversed
            # (123-abc.apps.googleusercontent.com → com.googleusercontent.apps.123-abc).
            if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
              printf 'GOOGLE_REVERSED_CLIENT_ID = com.googleusercontent.apps.%s\n' \
                "${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
            fi
          } > ios/Flutter/Secrets.xcconfig

      - name: Install App Store Connect API key
        if: steps.config.outputs.skip == 'false'
        run: |
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey.p8"
          chmod 600 "$KEY_DIR/AuthKey.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive (cloud signing)
        if: steps.config.outputs.skip == 'false'
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        if: steps.config.outputs.skip == 'false'
        run: |
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" ios/Flutter/Secrets.xcconfig
