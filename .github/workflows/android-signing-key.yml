name: Create Android signing key

# One-time, manual: creates the fixed release signing key on the runner and
# stores it directly as repository secrets (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) – no computer needed and the
# key never appears in the log or in the repository. Prints only the public
# certificate fingerprints (needed for Google sign-in and the Maps key).
#
# Needs a fine-grained personal access token for this repository with
# "Secrets: Read and write" as secret SIGNING_SETUP_TOKEN (delete it again
# afterwards). Refuses to run when a key already exists: replacing it would
# break updates of installed apps.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.SIGNING_SETUP_TOKEN }}
      EXISTING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check preconditions
        run: |
          if [ -n "$EXISTING_KEY" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists – not replacing the signing key."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SIGNING_SETUP_TOKEN is missing (see README, 'Fixed signing key')."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create key and store it as secrets
        run: |
          set +x
          umask 077
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keystore="$RUNNER_TEMP/release.jks"
          alias=smokingareas
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -alias "$alias" -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=smokingareas" \
            -storepass "$password" -keypass "$password" >/dev/null 2>&1
          base64 -w0 "$keystore" | gh secret set ANDROID_KEYSTORE_BASE64 -R "$GITHUB_REPOSITORY"
          printf '%s' "$password" | gh secret set ANDROID_KEYSTORE_PASSWORD -R "$GITHUB_REPOSITORY"
          printf '%s' "$alias" | gh secret set ANDROID_KEY_ALIAS -R "$GITHUB_REPOSITORY"
          {
            echo "### Android signing key created"
            echo
            echo "Public certificate fingerprints (not secret):"
            echo
            echo '```'
            keytool -list -v -keystore "$keystore" -storepass "$password" \
              | grep -E '^\s*(SHA1|SHA256):'
            echo '```'
            echo
            echo "Delete the secret SIGNING_SETUP_TOKEN and the token itself now."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$keystore"
